# codedb-mcp project configuration for cap1tal (https://github.com/killop/codedb-mcp).
# Scope: the TypeScript/TSX source the app and its Node-only gate actually run, plus the
# JS config files. Everything generated, vendored, native-build or personal is left out.
# The index itself lives next to this file and is gitignored; only this config is committed.

[scan]
# tree-sitter grammars exist for ts/tsx/js; Kotlin (modules/*/android) is NOT supported by
# codedb-mcp, so the two native modules stay reachable only through native grep/read.
extensions = ["ts", "tsx", "js", "mjs", "cjs"]
max_file_bytes = 2000000
respect_gitignore = true

# Empty = walk the repo root; skip_dirs / exclude_paths below carve out the rest.
root_paths = []
include_paths = []

# Globs applied after root selection. `.claude/worktrees` is hidden from git through
# .git/info/exclude (not .gitignore), so respect_gitignore alone would index every auto-work
# lane as a second copy of the app. `drizzle/` is generated by drizzle-kit (migrations.js
# bundle + SQL); the schema of record is src/db/schema.ts. `brag-output/` is a rendered video
# project, `dist/` an old web export, `scripts/icon` a Python icon generator.
exclude_paths = [
  ".claude/worktrees/**",
  "drizzle/**",
  "brag-output/**",
  "docs/**",
  "scripts/icon/**",
  "**/*.d.ts.map",
]

skip_dirs = [
  ".git",
  ".idea",
  ".vscode",
  ".gradle",
  ".kotlin",
  ".expo",
  ".cache",
  ".codedb-mcp",
  "node_modules",
  "android",
  "ios",
  "build",
  "dist",
  "web-build",
  "coverage",
  "worktrees",
  "__pycache__",
]

[diagnostics]
timing = false
slow_file_ms = 0

[logging]
enabled = false
file = ".codedb-mcp/codedb-mcp.log"
queue_capacity = 8192
flush_interval_ms = 500

[watch]
# MCP mode queues filesystem events and applies one incremental batch per tick; a change to
# this file's scan scope triggers one background full reindex.
enabled = true
poll_interval_seconds = 5

[storage]
enabled = true
dir = ".codedb-mcp"
