// The repo's first native module: Android only, autolinked from `modules/` by Expo (SDK 57's
// local-module support), so `expo prebuild` regenerating `android/` cannot lose it and nothing
// under the generated tree is ever hand-edited (rules/android.md).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notificationcapture'
version = '0.1.0'

// A module that lives in this repository and is consumed only by this app: there is no artifact
// for anyone to resolve, so nothing is published to a local Maven repository either.
expoModule {
  canBePublished = false
}

android {
  namespace "expo.modules.notificationcapture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // `NotificationManagerCompat.getEnabledListenerPackages` — the one androidx call the module
  // makes, and the same version the Expo modules in the tree resolve.
  implementation "androidx.core:core-ktx:1.17.0"
}
