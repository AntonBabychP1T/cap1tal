// The repo's first native module: Android only, autolinked from `modules/` by Expo (SDK 57's
// local-module support), so `expo prebuild` regenerating `android/` cannot lose it and nothing
// under the generated tree is ever hand-edited (rules/android.md).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notificationcapture'
version = '0.1.0'

// A module that lives in this repository and is consumed only by this app: there is no artifact
// for anyone to resolve, so nothing is published to a local Maven repository either.
expoModule {
  canBePublished = false
}

android {
  namespace "expo.modules.notificationcapture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

/** The installed `expo-background-task`'s version — the publication autolinking already links. */
def expoBackgroundTaskVersion = new groovy.json.JsonSlurper()
  .parse(file("${rootDir}/../node_modules/expo-background-task/package.json"))
  .version

dependencies {
  // `NotificationManagerCompat.getEnabledListenerPackages`, and the same version the Expo modules in
  // the tree resolve.
  implementation "androidx.core:core-ktx:1.17.0"
  // The дочитування (monobank-sync-freshness design D5): a one-off WorkManager run of the tasks
  // `expo-background-task` registered — the same WorkManager version that library resolves, and its
  // `BackgroundTaskConsumer` to run them through.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  // SDK 57 links Expo modules as the prebuilt publications they ship in `local-maven-repo`, which
  // autolinking adds to every project; the version is the installed package's, so an upgrade needs
  // no edit here.
  implementation "host.exp.exponent:expo.modules.backgroundtask:${expoBackgroundTaskVersion}"
  // `NudgeRule`'s JVM test: the privacy rule proven without a device.
  testImplementation "junit:junit:4.13.2"
}
